<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Features — steven-pribilinskiy/terminal</title>
<meta name="description" content="Every feature this Windows Terminal fork has that upstream doesn't, with dates, size, and links to the commits." />
<style>
  :root,
  :root[data-theme="light"] {
    --bg: #f3f3f3;
    --card: #ffffff;
    --control: #fbfbfb;
    --control-hover: #f6f6f6;
    --border: #e5e5e5;
    --stroke-subtle: #ededed;
    --text: #1b1b1b;
    --muted: #5d5d5d;
    --text-tertiary: #8c8c8c;
    --accent: #005fb8;
    --accent-hover: #196fbf;
    --on-accent: #ffffff;
    --accent-text: #005fb8;
    --success: #0f7b0f;
    --success-bg: #dff6dd;
    --elevation-card: 0 0 2px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.09);
    --elevation-flyout: 0 0 2px rgba(0, 0, 0, 0.12), 0 8px 16px rgba(0, 0, 0, 0.14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202020; --card: #2d2d2d; --control: #363636; --control-hover: #3c3c3c;
      --border: #3a3a3a; --stroke-subtle: #343434;
      --text: #ffffff; --muted: #cccccc; --text-tertiary: #969696;
      --accent: #60cdff; --accent-hover: #5ebce9; --on-accent: #000000; --accent-text: #99ebff;
      --success: #6ccb5f; --success-bg: #393d1b;
      --elevation-card: 0 0 2px rgba(0, 0, 0, 0.14), 0 1px 2px rgba(0, 0, 0, 0.2);
      --elevation-flyout: 0 0 2px rgba(0, 0, 0, 0.24), 0 8px 16px rgba(0, 0, 0, 0.28);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #202020; --card: #2d2d2d; --control: #363636; --control-hover: #3c3c3c;
    --border: #3a3a3a; --stroke-subtle: #343434;
    --text: #ffffff; --muted: #cccccc; --text-tertiary: #969696;
    --accent: #60cdff; --accent-hover: #5ebce9; --on-accent: #000000; --accent-text: #99ebff;
    --success: #6ccb5f; --success-bg: #393d1b;
    --elevation-card: 0 0 2px rgba(0, 0, 0, 0.14), 0 1px 2px rgba(0, 0, 0, 0.2);
    --elevation-flyout: 0 0 2px rgba(0, 0, 0, 0.24), 0 8px 16px rgba(0, 0, 0, 0.28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono, .commit-link {
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  }
  button, select, input { font-family: inherit; }

  /* ---------- pinned toolbar + independently scrolling results ----------
   * The toolbar is a flex sibling of <main>, not a sticky child of it, so it
   * never scrolls out of view no matter how the results list is filtered or
   * how tall it gets -- <main> is its own scroll container underneath it. */
  .toolbar {
    flex: 0 0 auto;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }
  .toolbar .back {
    font-size: 0.85rem;
    color: var(--muted);
    margin-right: 0.5rem;
    white-space: nowrap;
  }
  .search-box {
    position: relative;
    flex: 1 1 14rem;
    min-width: 10rem;
  }
  .search-box input {
    width: 100%;
    padding: 0.5rem 0.75rem 0.5rem 2rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--control);
    color: var(--text);
    font-size: 0.88rem;
  }
  .search-box input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-box::before {
    content: "\1F50D";
    position: absolute;
    left: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8rem;
    opacity: 0.5;
  }
  .chip-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .chip {
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    font-size: 0.75rem;
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    background: var(--control);
    white-space: nowrap;
  }
  .chip:hover { background: var(--control-hover); color: var(--text); }
  .chip.active { border-color: var(--accent); color: var(--accent-text); background: var(--control); }

  select.sort-select {
    padding: 0.45rem 0.6rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--control);
    color: var(--text);
    font-size: 0.82rem;
  }

  .view-switch {
    display: inline-flex;
    border-radius: 4px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .view-switch button {
    border: none;
    background: var(--control);
    color: var(--muted);
    padding: 0.45rem 0.8rem;
    font-size: 0.82rem;
    cursor: pointer;
    border-left: 1px solid var(--border);
  }
  .view-switch button:first-child { border-left: none; }
  .view-switch button:hover { background: var(--control-hover); color: var(--text); }
  .view-switch button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .theme-toggle { display: inline-flex; gap: 2px; border-radius: 4px; border: 1px solid var(--border); background: var(--control); padding: 2px; }
  .theme-toggle button { border: none; background: none; color: var(--muted); padding: 0.4rem 0.5rem; border-radius: 3px; cursor: pointer; font-size: 0.85rem; line-height: 1; }
  .theme-toggle button:hover { background: var(--control-hover); color: var(--text); }
  .theme-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    max-width: 78rem;
    width: 100%;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 5rem;
  }
  table.feature-table thead th {
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .result-count { color: var(--text-tertiary); font-size: 0.82rem; margin-bottom: 1rem; }

  .kicker {
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-text);
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.9rem;
    font-size: 0.76rem;
    color: var(--text-tertiary);
  }
  .meta-row .stat-add { color: var(--success); }
  .meta-row .stat-del { color: var(--muted); }
  .commit-link {
    font-size: 0.72rem;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    background: var(--control);
    border: 1px solid var(--border);
    color: var(--accent-text);
  }
  .commit-link:hover { background: var(--control-hover); text-decoration: none; }
  .demo-slot {
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.7rem;
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--text-tertiary);
  }

  /* ---------- Cards view ---------- */
  #view-cards.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
    gap: 1rem;
  }
  #view-cards .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--elevation-card);
    padding: 1.3rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  #view-cards .card:hover { box-shadow: var(--elevation-flyout); }
  #view-cards .card.standout { border-color: var(--accent); }
  #view-cards .card h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  #view-cards .card p.desc { margin: 0; color: var(--muted); font-size: 0.87rem; flex-grow: 1; }

  /* ---------- Preview view ---------- */
  #view-preview.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(24rem, 1fr));
    gap: 1.25rem;
  }
  #view-preview .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--elevation-card);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #view-preview .card.standout { border-color: var(--accent); }
  #view-preview .preview-visual {
    height: 9rem;
    background:
      repeating-linear-gradient(135deg, var(--control) 0 10px, var(--card) 10px 20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    font-size: 0.75rem;
    color: var(--text-tertiary);
  }
  #view-preview .body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.6rem; }
  #view-preview h3 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  #view-preview p.desc { margin: 0; color: var(--muted); font-size: 0.88rem; }

  /* ---------- Table view ---------- */
  table.feature-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table.feature-table th, table.feature-table td { padding: 0.65rem 0.9rem; text-align: left; border-bottom: 1px solid var(--stroke-subtle); }
  table.feature-table th { background: var(--control); font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
  table.feature-table th:hover { background: var(--control-hover); }
  table.feature-table th .arrow { opacity: 0.5; font-size: 0.75rem; margin-left: 0.2rem; }
  table.feature-table tr:last-child td { border-bottom: none; }
  table.feature-table tr:hover td { background: var(--control-hover); }
  table.feature-table td.desc-cell { color: var(--muted); max-width: 28rem; }
  table.feature-table .table-commits { display: flex; gap: 0.3rem; flex-wrap: wrap; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="toolbar">
  <a class="back" href="index.html">&larr; steven-pribilinskiy/terminal</a>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search features..." autocomplete="off" />
  </div>
  <div class="chip-row" id="category-chips">
    <button class="chip active" data-cat="all">All</button>
    <button class="chip" data-cat="automation">Automation</button>
    <button class="chip" data-cat="links">Links</button>
    <button class="chip" data-cat="ui">UI &amp; theming</button>
    <button class="chip" data-cat="deploy">Deploy system</button>
  </div>
  <select class="sort-select" id="sort-select">
    <option value="date-desc">Newest first</option>
    <option value="date-asc">Oldest first</option>
    <option value="size-desc">Largest change</option>
    <option value="size-asc">Smallest change</option>
    <option value="alpha">A&ndash;Z</option>
  </select>
  <div class="view-switch" role="group" aria-label="View">
    <button type="button" data-view="cards" aria-pressed="true">Cards</button>
    <button type="button" data-view="preview" aria-pressed="false">Preview</button>
    <button type="button" data-view="table" aria-pressed="false">Table</button>
  </div>
  <div class="theme-toggle" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="light" aria-pressed="false" title="Light">&#9728;</button>
    <button type="button" data-theme-choice="system" aria-pressed="true" title="Match system">&#9680;</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">&#9790;</button>
  </div>
</div>

<main>
  <div class="result-count" id="result-count"></div>
  <div class="grid" id="view-cards"></div>
  <div class="grid" id="view-preview" hidden></div>
  <table class="feature-table" id="view-table" hidden>
    <thead>
      <tr>
        <th data-sort="alpha">Feature</th>
        <th data-sort="cat">Category</th>
        <th data-sort="date-desc">Added</th>
        <th data-sort="size-desc">Changed</th>
        <th>Commits</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</main>

<script>
  const REPO = "https://github.com/steven-pribilinskiy/terminal/commit/";

  const FEATURES = [
    {
      id: "control-pipe", title: "Drive it from outside the process", cat: "automation", catLabel: "Automation",
      standout: true, dateAdded: "2026-08-16",
      desc: "Every window opens a local pipe another program can use: list which tabs and panes exist, read back exactly what a specific pane printed, or type into it directly — no simulated keystrokes, no guessing which window has focus. Scoped to your own user account, with a settings switch to turn it off entirely. Microsoft considered this exact capability twice (issue #9368, PR #20106) and passed; their own automation surface can't reach a pane running inside WSL.",
      commits: ["7ef36403f", "1c4da28dd"], files: 33, ins: 2028, del: 16, demo: "pending"
    },
    {
      id: "slot-system", title: "Slot badge, build info & update banner", cat: "deploy", catLabel: "Deploy system",
      dateAdded: "2026-08-15",
      desc: "A tab-row badge names which slot (Test/Dev) you're running, click it to copy build info, the About dialog shows commit and build time, and an update banner names what's available and where it came from.",
      commits: ["1f779cbc9", "a766ea36b", "da724f9f0", "e2463ad5b", "a31749e61"], files: 32, ins: 696, del: 69
    },
    {
      id: "distinct-identity", title: "The test build can't impersonate the real one", cat: "deploy", catLabel: "Deploy system",
      dateAdded: "2026-08-17",
      desc: "Windows only lets one instance of a given app identity run at a time, and the disposable test build used to share an identity with the live one — opening it would silently hand off to the live window and quietly run its code instead. Each now has its own distinct identity, so the disposable build actually runs, side by side with the live one.",
      commits: ["a98921578"], files: 3, ins: 41, del: 6
    },
    {
      id: "auto-promote", title: "Narrow auto-promote exception", cat: "automation", catLabel: "Automation",
      dateAdded: "2026-08-31",
      desc: "A verified, read-only check (fails closed on anything ambiguous) that allows promoting a staged build without asking, only when the production window has nothing running that would be lost.",
      commits: ["416988a08"], files: 2, ins: 143, del: 3
    },
    {
      id: "ci-poll", title: "CI-poll-cadence setting", cat: "deploy", catLabel: "Deploy system",
      dateAdded: "2026-08-31",
      desc: "How often the background poller checks for a new CI build is a real Settings UI control now, not a fixed constant.",
      commits: ["1692ac5a9"], files: 10, ins: 97, del: 1
    },
    {
      id: "ci-tests", title: "CI runs tests and ships the Test payload", cat: "deploy", catLabel: "Deploy system",
      dateAdded: "2026-08-31",
      desc: "CI used to compile and nothing else. It now runs two unit-test suites and ships a Test-slot payload alongside Dev's, so a machine that never compiles can still verify UI behaviour.",
      commits: ["97a5cc18c"], files: 1, ins: 36, del: 0
    },
    {
      id: "window-persist", title: "Per-window position & size", cat: "ui", catLabel: "UI & theming",
      dateAdded: "2026-08-23",
      desc: "Each window remembers where it was and reopens there, instead of every new window landing in the same default spot.",
      commits: ["552f130c2"], files: 22, ins: 763, del: 37, demo: "pending"
    },
    {
      id: "plain-click", title: "Plain-click links, everywhere", cat: "links", catLabel: "Links",
      dateAdded: "2026-08-16",
      desc: "Links open on a plain click — no Ctrl required, toggleable in Settings — and correctly inside mouse-mode apps like tmux, where a click would otherwise just move the cursor.",
      commits: ["92cfcb8ab", "7f20f24f7", "9e668b8b6"], files: 15, ins: 204, del: 14, demo: "pending"
    },
    {
      id: "slack-links", title: "Slack-style bracketed links", cat: "links", catLabel: "Links",
      dateAdded: "2026-08-20",
      desc: "&lt;url|label&gt; links — the format Slack and many CLIs emit — become clickable with the label shown, instead of just the raw bracketed text.",
      commits: ["c2dd09a42"], files: 6, ins: 61, del: 8
    },
    {
      id: "wsl-links", title: "WSL file:// link resolution", cat: "links", catLabel: "Links",
      dateAdded: "2026-08-25",
      desc: "A WSL file:// link resolves to the right distro's launchable UNC path, fragments included, instead of failing to open or opening the wrong file.",
      commits: ["d0f44aab7", "c15aae37a"], files: 10, ins: 585, del: 75
    },
    {
      id: "link-card", title: "A link card that actually fits", cat: "links", catLabel: "Links",
      dateAdded: "2026-08-31",
      desc: "The plain hover tooltip became a richer card — configurable delay, a \"how to open\" hint, room for an action button — that flips to whichever side has room and never renders past the pane's edge, on either axis.",
      commits: ["db520fed5", "bb45059e6", "7d4de07c1", "cf9ce0111", "69ae29d2c"], files: 37, ins: 814, del: 288, demo: "pending"
    },
    {
      id: "icons", title: "Profile icon caching & jump-list glyphs", cat: "ui", catLabel: "UI & theming",
      dateAdded: "2026-08-25",
      desc: "An http(s) profile icon is cached locally so settings load never blocks on the network; glyph/emoji icons get rasterized into real jump-list icons instead of a blank tile, refreshed automatically on deploy.",
      commits: ["b8bc5aa7e", "208d67c4d", "088757274", "c14db2649"], files: 12, ins: 722, del: 17
    },
    {
      id: "defaults", title: "Quieter interaction defaults", cat: "ui", catLabel: "UI & theming",
      dateAdded: "2026-08-17",
      desc: "Text selection can search with your default engine, the mouse wheel no longer changes font size or opacity by accident, and quitting doesn't ask \"close all windows?\" when there's only one open.",
      commits: ["88069dd16", "d9acb4bf4"], files: 3, ins: 34, del: 6
    },
    {
      id: "color-schemes", title: "Separate light & dark color schemes", cat: "ui", catLabel: "UI & theming",
      dateAdded: "2026-08-15",
      desc: "Pick one scheme for light mode and a different one for dark — the terminal actually follows the OS appearance instead of being stuck on whichever scheme you set last.",
      commits: ["68e59692a"], files: 10, ins: 396, del: 223, demo: "pending"
    }
  ];

  const state = { query: "", cat: "all", sort: "date-desc", view: "cards" };

  function matches(f) {
    if (state.cat !== "all" && f.cat !== state.cat) return false;
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    return f.title.toLowerCase().indexOf(q) !== -1 || f.desc.toLowerCase().indexOf(q) !== -1;
  }

  function compare(a, b) {
    switch (state.sort) {
      case "date-asc": return a.dateAdded.localeCompare(b.dateAdded);
      case "date-desc": return b.dateAdded.localeCompare(a.dateAdded);
      case "size-desc": return (b.ins + b.del) - (a.ins + a.del);
      case "size-asc": return (a.ins + a.del) - (b.ins + b.del);
      case "alpha": return a.title.localeCompare(b.title);
      case "cat": return a.catLabel.localeCompare(b.catLabel) || a.title.localeCompare(b.title);
      default: return 0;
    }
  }

  function commitLinks(f) {
    return f.commits.map(function (sha) {
      return '<a class="commit-link" href="' + REPO + sha + '" target="_blank" rel="noopener">' + sha.slice(0, 7) + '</a>';
    }).join(" ");
  }

  function metaRow(f) {
    return '<div class="meta-row">' +
      '<span>' + f.dateAdded + '</span>' +
      '<span><span class="stat-add">+' + f.ins + '</span> <span class="stat-del">&minus;' + f.del + '</span> &middot; ' + f.files + ' files</span>' +
      '</div>';
  }

  function renderCards(list) {
    const el = document.getElementById("view-cards");
    el.innerHTML = list.map(function (f) {
      return '<article class="card' + (f.standout ? ' standout' : '') + '">' +
        '<span class="kicker">' + f.catLabel + '</span>' +
        '<h3>' + f.title + '</h3>' +
        '<p class="desc">' + f.desc + '</p>' +
        metaRow(f) +
        '<div class="table-commits">' + commitLinks(f) + '</div>' +
        (f.demo ? '<div class="demo-slot">demo: recording ' + f.demo + '</div>' : '') +
        '</article>';
    }).join("");
  }

  function renderPreview(list) {
    const el = document.getElementById("view-preview");
    el.innerHTML = list.map(function (f) {
      return '<article class="card' + (f.standout ? ' standout' : '') + '">' +
        '<div class="preview-visual">' + (f.demo ? 'demo recording ' + f.demo : f.catLabel) + '</div>' +
        '<div class="body">' +
        '<span class="kicker">' + f.catLabel + '</span>' +
        '<h3>' + f.title + '</h3>' +
        '<p class="desc">' + f.desc + '</p>' +
        metaRow(f) +
        '<div class="table-commits">' + commitLinks(f) + '</div>' +
        '</div></article>';
    }).join("");
  }

  function renderTable(list) {
    const el = document.getElementById("table-body");
    el.innerHTML = list.map(function (f) {
      return '<tr>' +
        '<td><strong>' + f.title + '</strong></td>' +
        '<td>' + f.catLabel + '</td>' +
        '<td>' + f.dateAdded + '</td>' +
        '<td><span class="stat-add">+' + f.ins + '</span> <span class="stat-del">&minus;' + f.del + '</span></td>' +
        '<td class="table-commits">' + commitLinks(f) + '</td>' +
        '</tr>';
    }).join("");
  }

  function render() {
    const list = FEATURES.filter(matches).sort(compare);
    document.getElementById("result-count").textContent =
      list.length + " of " + FEATURES.length + " features";
    renderCards(list);
    renderPreview(list);
    renderTable(list);
  }

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value;
    render();
  });

  document.querySelectorAll("#category-chips .chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      document.querySelectorAll("#category-chips .chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      state.cat = chip.dataset.cat;
      render();
    });
  });

  document.getElementById("sort-select").addEventListener("change", function (e) {
    state.sort = e.target.value;
    render();
  });

  const viewButtons = document.querySelectorAll(".view-switch button");
  const viewEls = {
    cards: document.getElementById("view-cards"),
    preview: document.getElementById("view-preview"),
    table: document.getElementById("view-table")
  };
  viewButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      viewButtons.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
      btn.setAttribute("aria-pressed", "true");
      state.view = btn.dataset.view;
      Object.keys(viewEls).forEach(function (key) {
        viewEls[key].hidden = key !== state.view;
      });
    });
  });

  // Sortable table headers double as the same sort control.
  document.querySelectorAll("th[data-sort]").forEach(function (th) {
    th.addEventListener("click", function () {
      state.sort = th.dataset.sort;
      // No-ops harmlessly when the column (e.g. Category) has no matching
      // <option> -- the dropdown just keeps showing whatever it last had.
      document.getElementById("sort-select").value = state.sort;
      render();
    });
  });

  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll("[data-theme-choice]");
    var stored = null;
    try { stored = localStorage.getItem("theme"); } catch (e) {}
    function apply(choice) {
      if (choice === "system") root.removeAttribute("data-theme");
      else root.setAttribute("data-theme", choice);
      buttons.forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.themeChoice === choice));
      });
    }
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var choice = btn.dataset.themeChoice;
        apply(choice);
        try { localStorage.setItem("theme", choice); } catch (e) {}
      });
    });
    apply(stored || "system");
  })();

  render();
</script>

</body>
</html>
